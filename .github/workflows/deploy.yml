name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# Two pushes to main close together must not SSH into the same server at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/aguiarpaulo/ged-dge-api
  WEB_IMAGE: ghcr.io/aguiarpaulo/ged-dge-web

jobs:
  # Runs on every push and pull request: nothing merges or deploys without passing
  # this gate. The project has no CI today, so this is what actually keeps a broken
  # commit off main and off the server.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run pytest (includes the secret-hygiene check on the compose files)
        run: uv run pytest

      - name: Lint (ruff)
        run: uv run ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint (eslint)
        run: npm --prefix frontend run lint

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend unit tests
        run: npm --prefix frontend test

      - name: Frontend build (tsc --noEmit && vite build)
        run: npm --prefix frontend run build

  # Only on a push to main: pull requests are gated by the test job above but never
  # publish images. Builds both images in CI so the server only ever pulls — building
  # on a small free-tier VM alongside a live Postgres+MinIO stack is what this avoids.
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # linux/arm64 is here for Oracle Cloud's Always Free Ampere A1 VMs (see the
      # README's free-tier section) — without it, `docker compose pull` on an ARM
      # host finds no matching manifest for these images.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # SSHes into whatever box DEPLOY_HOST names — a DigitalOcean Droplet, an Oracle
  # Cloud Always Free VM, or any other box reachable over SSH with docker-compose.yml,
  # docker-compose.prod.yml and docker/Caddyfile already copied to /opt/ged, plus a
  # production .env already in place (never touched by this pipeline). `--pull always`
  # forces a fresh pull of the images just published above; the compose command below
  # never asks for a rebuild, so the server never builds — see
  # test_deploy_command_never_rebuilds_on_the_server.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ged
            # The backup overlay (docker-compose.backup.yml) is optional — copied to
            # /opt/ged only if you opted in (see README). Its presence is how we know
            # to include it: --remove-orphans would otherwise treat its long-running
            # `backup` container as undeclared and kill it on every deploy.
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            if [ -f docker-compose.backup.yml ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.backup.yml"
            fi
            docker compose $COMPOSE_FILES up -d --pull always --remove-orphans
            docker image prune -f
