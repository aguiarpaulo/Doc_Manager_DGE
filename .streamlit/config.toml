# Visual identity for the GED DGE interface.
#
# This is an internal records system for a construction company, so it is styled like
# institutional software rather than a consumer product: one restrained accent colour,
# neutral greys, dense type, and square corners everywhere.
#
# Everything here is native Streamlit theming rather than injected CSS, so it survives
# Streamlit upgrades and applies to widgets we never touch directly.

[theme]
# Pinned to light on purpose. A records system should look identical on every desk, and
# a half-tuned dark variant would read as less trustworthy than a deliberate light one.
base = "light"

# One accent, used for actions and focus only. Deep institutional blue reads as
# official and keeps 7:1 contrast on white, so it is safe on small text too.
primaryColor = "#15497B"

backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#1C1F23"
linkColor = "#15497B"
linkUnderline = true

codeBackgroundColor = "#F1F3F5"
codeTextColor = "#1C1F23"

# Square corners throughout, including buttons, which default to baseRadius.
baseRadius = "none"
buttonRadius = "none"

# With no rounding to separate them, controls need a visible edge or the form dissolves
# into the page. Borders are doing the structural work that corners usually do.
borderColor = "#D3D8DE"
dataframeBorderColor = "#D3D8DE"
dataframeHeaderBackgroundColor = "#E9ECEF"
showWidgetBorder = true
showSidebarBorder = true

# 15px over the 16px default: denser lines fit more of a document list on screen,
# which is what this app is actually for.
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseFontWeight = 400

# Status colours, tuned so the four document states stay distinguishable when printed
# in greyscale or seen by a red-green colourblind reader: they differ in lightness too.
greenColor = "#1E6B3A"
orangeColor = "#9A5B00"
redColor = "#A32020"
grayColor = "#5A6169"
