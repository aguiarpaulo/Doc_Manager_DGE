services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ged}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ged}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ged}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GED_MINIO_ACCESS_KEY:?set GED_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${GED_MINIO_SECRET_KEY:?set GED_MINIO_SECRET_KEY in .env}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      GED_ENVIRONMENT: production
      GED_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ged}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ged}
      GED_JWT_SECRET: ${GED_JWT_SECRET:?set GED_JWT_SECRET in .env}
      GED_MINIO_ENDPOINT: minio:9000
      GED_MINIO_ACCESS_KEY: ${GED_MINIO_ACCESS_KEY}
      GED_MINIO_SECRET_KEY: ${GED_MINIO_SECRET_KEY}
      GED_MINIO_BUCKET: ${GED_MINIO_BUCKET:-documents}
      GED_MINIO_SECURE: "false"
      GED_BOOTSTRAP_ADMIN_USERNAME: ${GED_BOOTSTRAP_ADMIN_USERNAME:-}
      GED_BOOTSTRAP_ADMIN_EMAIL: ${GED_BOOTSTRAP_ADMIN_EMAIL:-}
      GED_BOOTSTRAP_ADMIN_PASSWORD: ${GED_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Sem env_file: este bloco e a lista do que chega ao container. Variavel do
      # .env que nao estiver aqui e ignorada em silencio (tests/test_compose_api_env.py).
      # GED_SMTP_HOST vazio = modo console: o token de reset vai para o log.
      GED_SMTP_HOST: ${GED_SMTP_HOST:-}
      GED_SMTP_PORT: ${GED_SMTP_PORT:-587}
      GED_SMTP_STARTTLS: ${GED_SMTP_STARTTLS:-true}
      GED_SMTP_USER: ${GED_SMTP_USER:-}
      GED_SMTP_PASSWORD: ${GED_SMTP_PASSWORD:-}
      GED_SMTP_FROM: ${GED_SMTP_FROM:-}
      GED_APP_URL_BASE: ${GED_APP_URL_BASE:-}
      # Vazio por padrao: producao serve SPA e API pela mesma origem (Caddy), entao
      # nao ha chamada cruzada a autorizar. So preencher para apontar o servidor de
      # desenvolvimento do Vite (:5173) direto para esta API.
      GED_CORS_ORIGINS: ${GED_CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Origem unica: serve a SPA como estatico e publica a API sob /api, com
  # terminacao HTTPS automatica (GAP-002). Como os dois lados compartilham a
  # origem, nao existe requisicao entre origens e portanto nao ha CORS.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Caminho-base do bundle e base da API sao configuracao de build.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
